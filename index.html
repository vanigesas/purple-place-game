<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastelería Purple Place</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <header>
            <h1>Pastelería Purple Place</h1>
        </header>

        <main>
            <section id="order-section">
                <h2>Pedido del Cliente</h2>
                <div id="order-display">
                    <!-- El pedido del cliente se mostrará aquí -->
                </div>
            </section>

            <section id="cake-station">
                <h2>Crea el Pastel</h2>
                <div id="cake-preview">
                    <!-- Vista previa del pastel que se está creando -->
                </div>
                <div id="cake-options">
                    <!-- Opciones para construir el pastel (base, glaseado, decoración) -->
                </div>
                <button id="submit-order-btn">Entregar Pedido</button>
            </section>
        </main>

        <footer>
            <p>Puntuación: <span id="score">0</span></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
